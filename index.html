<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>S.H.A.M Coco Production - Daily Expenses</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap');
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Inter',system-ui,sans-serif; background:#EFE7D3; color:#3A2E1E; }
  .mono { font-family:'IBM Plex Mono', monospace; }
  .display { font-family:'Fraunces', serif; }
  .wrap { max-width:640px; margin:0 auto; padding:16px 8px 60px; }
  .card { position:relative; background:#F3ECD9; border:1px solid #D8C89A; border-radius:14px; padding:26px 22px; overflow:hidden; }
  .leaf-corner { position:absolute; font-size:60px; opacity:0.35; pointer-events:none; line-height:1; }
  .tl { top:-10px; left:-10px; }
  .bl { bottom:-10px; left:-10px; transform:scaleX(-1) rotate(10deg); }
  .br { bottom:-10px; right:-10px; rotate:180deg; }
  header { position:relative; z-index:1; display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
  .datebox { text-align:right; }
  .weekday { font-size:13px; font-weight:700; color:#4A3B28; letter-spacing:0.03em; }
  .dateshort { font-size:17px; font-weight:700; color:#3B6B35; }
  .brand { position:relative; z-index:1; text-align:center; margin-bottom:16px; }
  .brand h1 { font-size:22px; font-weight:700; margin:0; color:#4A3B28; }
  .brand h2 { font-size:24px; font-weight:900; margin:2px 0 8px; color:#3B6B35; }
  .divider { display:flex; align-items:center; justify-content:center; gap:10px; color:#9A8B6E; }
  .divider .line { height:1px; background:#C9BC9C; flex:1; max-width:90px; }
  nav.tabs { position:relative; z-index:1; display:flex; gap:8px; margin-bottom:14px; }
  nav.tabs button { flex:1; padding:9px 0; border-radius:6px; border:1px solid #C9BC9C; background:transparent; color:#4A3B28; font-size:13px; font-weight:600; cursor:pointer; }
  nav.tabs button.active { background:#4A3B28; color:#F3ECD9; }
  .datenav { display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:12px; }
  .datenav button { border:none; background:#E4D8B4; border-radius:6px; padding:7px 10px; cursor:pointer; font-size:14px; }
  .cashbox { text-align:center; margin-bottom:14px; }
  .cashbox label { font-size:11px; font-weight:600; color:#6B5B45; text-transform:uppercase; letter-spacing:0.04em; }
  .cashbox .row { display:flex; align-items:center; justify-content:center; gap:4px; }
  .cashbox input { font-size:20px; font-weight:600; border:none; border-bottom:2px solid #C9BC9C; background:transparent; width:140px; padding:4px 0; text-align:center; }
  .ledger-row { border-bottom:1px dotted #B8A87E; display:flex; align-items:baseline; gap:10px; padding:9px 2px; }
  .ledger-row .iname { flex:1; font-size:16px; font-weight:700; }
  .ledger-row .icat { font-size:11px; color:#8A7A5E; white-space:nowrap; }
  .ledger-row .iprice { font-size:16px; font-weight:700; min-width:50px; text-align:right; }
  .ledger-row .idel { border:none; background:none; color:#B33A3A; cursor:pointer; padding:2px; font-size:15px; }
  .form-row { display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .form-row input, .form-row select { padding:9px 10px; border-radius:6px; border:1px solid #C9BC9C; font-size:13px; }
  .form-row .fname { flex:2; min-width:110px; }
  .form-row .fprice { flex:1; min-width:80px; }
  .form-row .fcat { flex:1; min-width:110px; background:white; }
  .form-row .fcustom { flex:1; min-width:110px; }
  .form-row .fadd { padding:9px 14px; border-radius:6px; border:none; background:#3B6B35; color:white; font-size:13px; font-weight:600; cursor:pointer; }
  .totals { border-top:1px solid #C9BC9C; padding-top:14px; }
  .totals .line { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .totals .label { font-size:16px; color:#4A3B28; font-family:'Fraunces',serif; }
  .totals .val { font-size:18px; font-weight:700; }
  .actions { display:flex; gap:8px; margin-top:18px; }
  .actions button { display:flex; align-items:center; justify-content:center; gap:6px; padding:10px 0; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; }
  .btn-export { flex:1; border:1px solid #4A3B28; background:transparent; color:#4A3B28; }
  .btn-clear { border:1px solid #C9BC9C; background:transparent; color:#6B5B45; padding:10px 12px; }
  .empty { font-size:13px; color:#9A8B6E; text-align:center; margin:0 0 10px; }
  .month-row { display:flex; justify-content:space-between; padding:9px 2px; font-size:13px; border-bottom:1px dotted #B8A87E; }
  .month-total { display:flex; justify-content:space-between; padding:12px 2px; font-size:14px; font-weight:700; border-top:1px solid #C9BC9C; margin-top:4px; }
  .save-note { font-size:11px; color:#9A8B6E; text-align:center; margin-bottom:6px; }
  .lock-btn { border:none; background:none; color:#8A7A5E; font-size:12px; cursor:pointer; text-decoration:underline; }
  #lockScreen { position:fixed; inset:0; background:#EFE7D3; display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .lock-card { background:#F3ECD9; border:1px solid #D8C89A; border-radius:14px; padding:34px 26px; max-width:340px; width:100%; text-align:center; }
  .lock-card input { font-size:22px; letter-spacing:6px; text-align:center; width:160px; padding:10px; border-radius:8px; border:1px solid #C9BC9C; margin:14px 0; }
  .lock-card button { padding:10px 26px; border-radius:8px; border:none; background:#3B6B35; color:white; font-size:14px; font-weight:600; cursor:pointer; }
  .lock-error { color:#B33A3A; font-size:13px; min-height:18px; }
  @media print {
    .no-print { display:none !important; }
    body { background:white; }
  }
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-card">
    <div class="leaf-corner" style="position:relative;font-size:40px;">&#127811;</div>
    <h1 class="display" style="font-size:19px;color:#4A3B28;margin:6px 0 2px;">S.H.A.M COCO PRODUCTION</h1>
    <p style="font-size:12px;color:#6B5B45;margin:0 0 10px;">Enter PIN to view expenses</p>
    <input type="password" inputmode="numeric" maxlength="6" id="pinInput" placeholder="••••" />
    <div class="lock-error" id="lockError"></div>
    <button id="pinSubmit">Unlock</button>
  </div>
</div>

<div class="wrap" id="appRoot" style="display:none;">
  <div class="card" id="mainCard">
    <div class="leaf-corner tl">&#127811;</div>
    <div class="leaf-corner bl">&#127811;</div>
    <div class="leaf-corner br">&#127811;</div>

    <header>
      <button class="lock-btn no-print" id="lockAgainBtn">&#128274; Lock</button>
      <div class="datebox">
        <div class="weekday" id="weekdayLabel"></div>
        <div class="dateshort" id="dateShortLabel"></div>
      </div>
    </header>

    <div class="brand">
      <img src="logo.png" alt="SHAM Coco Production logo" style="width:110px;height:110px;object-fit:contain;margin-bottom:6px;" />
      <h1>S.H.A.M COCO PRODUCTION</h1>
      <h2>DAILY EXPENSES</h2>
      <div class="divider"><div class="line"></div><span>&#127811;</span><div class="line"></div></div>
    </div>

    <nav class="tabs no-print">
      <button id="tabDay" class="active">Day</button>
      <button id="tabMonth">Month</button>
    </nav>

    <div id="dayView">
      <div class="datenav no-print">
        <button id="prevDay">&#8592;</button>
        <span class="mono" id="niceDate" style="font-size:13px;color:#6B5B45;"></span>
        <button id="nextDay">&#8594;</button>
      </div>

      <div class="cashbox no-print">
        <label>Cash received today</label>
        <div class="row">
          <span class="mono" style="font-size:18px;color:#3B6B35;">&#8377;</span>
          <input type="number" inputmode="decimal" placeholder="0" id="cashInput" class="mono" />
        </div>
      </div>

      <div id="itemsList"></div>

      <div class="form-row no-print">
        <input class="fname" placeholder="Item name" id="itemName" />
        <input class="fprice" type="number" inputmode="decimal" placeholder="Price" id="itemPrice" />
        <select class="fcat" id="itemCat">
          <option>Travel</option>
          <option>Food</option>
          <option>Transport</option>
          <option>Coconut Supplies</option>
          <option>Other</option>
        </select>
        <input class="fcustom" placeholder="Type category" id="itemCustomCat" style="display:none;" />
        <button class="fadd" id="addItemBtn">+ Add</button>
      </div>
      <div class="save-note no-print" id="saveNote"></div>

      <div class="totals">
        <div class="line"><span class="label">Total cash &raquo;&raquo;</span><span class="val mono" id="totalCashVal" style="color:#B5651D;"></span></div>
        <div class="line"><span class="label">Balance cash &raquo;&raquo;</span><span class="val mono" id="balanceVal"></span></div>
      </div>

      <div class="actions no-print">
        <button class="btn-export" id="exportDayBtn">&#128424; Export day (PDF)</button>
        <button class="btn-clear" id="clearDayBtn">&#8635; Clear</button>
      </div>
    </div>

    <div id="monthView" style="display:none;">
      <h2 class="display" style="font-size:17px;margin:0 0 12px;text-align:center;color:#4A3B28;" id="monthLabel"></h2>
      <div id="monthRows"></div>
      <button class="btn-export no-print" id="exportMonthBtn" style="width:100%;">&#128424; Export month (PDF)</button>
    </div>
  </div>
</div>

<script>
// ====== SETTINGS ======
const ACCESS_PIN = "19744"; // <-- change this number to your secret PIN
const firebaseConfig = {
  apiKey: "AIzaSyA4Kh806eyIy3yjuRmmF6HSKM93xwtQ00A",
  authDomain: "wm-point-e9196.firebaseapp.com",
  projectId: "wm-point-e9196",
  storageBucket: "wm-point-e9196.firebasestorage.app",
  messagingSenderId: "708620946182",
  appId: "1:708620946182:web:620dabf9c46418d92dec87"
};
// ======================

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

const CATS = ["Travel","Food","Transport","Coconut Supplies","Other"];

function fmtDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function fmtParts(dstr){
  const d = new Date(dstr+"T00:00:00");
  const weekday = d.toLocaleDateString("en-IN",{weekday:"long"}).toUpperCase();
  const dd=String(d.getDate()).padStart(2,"0"), mm=String(d.getMonth()+1).padStart(2,"0"), yy=String(d.getFullYear()).slice(-2);
  return {weekday, short:`${dd}-${mm}-${yy}`};
}
function fmtNice(dstr){
  const d = new Date(dstr+"T00:00:00");
  return d.toLocaleDateString("en-IN",{weekday:"short",day:"2-digit",month:"short",year:"numeric"});
}
function monthKey(dstr){ return dstr.slice(0,7); }
function monthNice(mk){
  const d = new Date(mk+"-01T00:00:00");
  return d.toLocaleDateString("en-IN",{month:"long",year:"numeric"});
}
function rupee(n){ return (Number(n)||0).toLocaleString("en-IN",{minimumFractionDigits:0,maximumFractionDigits:0}); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// ---------- LOCK SCREEN ----------
function tryUnlock(){
  const val = document.getElementById("pinInput").value.trim();
  if(val === ACCESS_PIN){
    localStorage.setItem("sham-unlocked","true");
    showApp();
  } else {
    document.getElementById("lockError").textContent = "Wrong PIN, try again.";
  }
}
document.getElementById("pinSubmit").addEventListener("click", tryUnlock);
document.getElementById("pinInput").addEventListener("keydown", (e)=>{ if(e.key==="Enter") tryUnlock(); });
document.getElementById("lockAgainBtn").addEventListener("click", ()=>{
  localStorage.removeItem("sham-unlocked");
  document.getElementById("appRoot").style.display="none";
  document.getElementById("lockScreen").style.display="flex";
  document.getElementById("pinInput").value="";
});

function showApp(){
  document.getElementById("lockScreen").style.display="none";
  document.getElementById("appRoot").style.display="block";
  auth.signInAnonymously().then(()=>{
    loadDay(selectedDate);
  }).catch((e)=>{
    document.getElementById("saveNote").textContent = "Connection error. Check internet.";
  });
}

if(localStorage.getItem("sham-unlocked") === "true"){
  showApp();
}

// ---------- APP STATE ----------
let selectedDate = fmtDate(new Date());
let cashReceived = "";
let items = [];

function loadDay(dateStr){
  document.getElementById("saveNote").textContent = "Loading...";
  db.collection("expenses").doc(dateStr).get().then((doc)=>{
    if(doc.exists){
      const parsed = doc.data();
      cashReceived = parsed.cashReceived != null ? String(parsed.cashReceived) : "";
      items = Array.isArray(parsed.items) ? parsed.items : [];
    } else {
      cashReceived = ""; items = [];
    }
    document.getElementById("saveNote").textContent = "";
    renderDay();
  }).catch((e)=>{
    document.getElementById("saveNote").textContent = "Couldn't load. Check internet.";
    cashReceived = ""; items = [];
    renderDay();
  });
}

function persistDay(dateStr, nextCash, nextItems){
  document.getElementById("saveNote").textContent = "Saving...";
  db.collection("expenses").doc(dateStr).set({
    cashReceived: Number(nextCash)||0,
    items: nextItems,
    date: dateStr,
    month: monthKey(dateStr)
  }).then(()=>{
    document.getElementById("saveNote").textContent = "Saved";
    setTimeout(()=>{ document.getElementById("saveNote").textContent=""; }, 1200);
  }).catch((e)=>{
    document.getElementById("saveNote").textContent = "Couldn't save. Check internet.";
  });
}

function renderDay(){
  const dp = fmtParts(selectedDate);
  document.getElementById("weekdayLabel").textContent = dp.weekday;
  document.getElementById("dateShortLabel").textContent = dp.short;
  document.getElementById("niceDate").textContent = fmtNice(selectedDate);
  document.getElementById("cashInput").value = cashReceived;

  const list = document.getElementById("itemsList");
  list.innerHTML = "";
  if(items.length===0){
    const p = document.createElement("p");
    p.className="empty"; p.textContent="No items yet today. Add below.";
    list.appendChild(p);
  } else {
    items.forEach(it=>{
      const row = document.createElement("div");
      row.className="ledger-row display";
      row.innerHTML = `<div class="iname">${escapeHtml(it.name.toUpperCase())}</div><div class="icat">${escapeHtml(it.category)}</div><div class="iprice mono">${rupee(it.price)}</div><button class="idel no-print" data-id="${it.id}">&#128465;</button>`;
      list.appendChild(row);
    });
    list.querySelectorAll(".idel").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        items = items.filter(i=>i.id!==btn.dataset.id);
        persistDay(selectedDate, cashReceived, items);
        renderDay();
      });
    });
  }

  const totalSpent = items.reduce((s,i)=>s+Number(i.price),0);
  const balance = (Number(cashReceived)||0) - totalSpent;
  document.getElementById("totalCashVal").textContent = rupee(cashReceived);
  const balEl = document.getElementById("balanceVal");
  balEl.textContent = rupee(balance);
  balEl.style.color = balance < 0 ? "#B33A3A" : "#3B6B35";
}

document.getElementById("cashInput").addEventListener("input", (e)=>{
  cashReceived = e.target.value;
  persistDay(selectedDate, cashReceived, items);
  renderDay();
});

document.getElementById("itemCat").addEventListener("change", (e)=>{
  document.getElementById("itemCustomCat").style.display = e.target.value==="Other" ? "block" : "none";
});

document.getElementById("addItemBtn").addEventListener("click", ()=>{
  const name = document.getElementById("itemName").value.trim();
  const price = document.getElementById("itemPrice").value;
  const catSel = document.getElementById("itemCat").value;
  const custom = document.getElementById("itemCustomCat").value.trim();
  const finalCat = catSel==="Other" && custom ? custom : catSel;
  if(!name || !price || Number(price)<=0) return;
  items.push({id:Date.now().toString(36), name, price:Number(price), category:finalCat});
  persistDay(selectedDate, cashReceived, items);
  document.getElementById("itemName").value="";
  document.getElementById("itemPrice").value="";
  document.getElementById("itemCat").value="Travel";
  document.getElementById("itemCustomCat").value="";
  document.getElementById("itemCustomCat").style.display="none";
  renderDay();
});

document.getElementById("prevDay").addEventListener("click", ()=>{
  const d = new Date(selectedDate+"T00:00:00"); d.setDate(d.getDate()-1);
  selectedDate = fmtDate(d); loadDay(selectedDate);
});
document.getElementById("nextDay").addEventListener("click", ()=>{
  const d = new Date(selectedDate+"T00:00:00"); d.setDate(d.getDate()+1);
  selectedDate = fmtDate(d); loadDay(selectedDate);
});
document.getElementById("clearDayBtn").addEventListener("click", ()=>{
  items=[]; cashReceived="";
  persistDay(selectedDate, "", []);
  renderDay();
});

document.getElementById("tabDay").addEventListener("click", ()=>{
  document.getElementById("dayView").style.display="block";
  document.getElementById("monthView").style.display="none";
  document.getElementById("tabDay").classList.add("active");
  document.getElementById("tabMonth").classList.remove("active");
});
document.getElementById("tabMonth").addEventListener("click", ()=>{
  document.getElementById("dayView").style.display="none";
  document.getElementById("monthView").style.display="block";
  document.getElementById("tabDay").classList.remove("active");
  document.getElementById("tabMonth").classList.add("active");
  renderMonth();
});

function renderMonth(){
  const mk = monthKey(selectedDate);
  document.getElementById("monthLabel").textContent = monthNice(mk);
  const container = document.getElementById("monthRows");
  container.innerHTML = '<p class="empty">Loading...</p>';
  db.collection("expenses").where("month","==",mk).get().then((snap)=>{
    const rows = [];
    snap.forEach(doc=>{
      const parsed = doc.data();
      const spent = (parsed.items||[]).reduce((s,i)=>s+Number(i.price),0);
      rows.push({date: doc.id, cash: Number(parsed.cashReceived)||0, spent});
    });
    rows.sort((a,b)=>a.date.localeCompare(b.date));
    container.innerHTML = "";
    if(rows.length===0){
      container.innerHTML = '<p class="empty">No entries yet this month.</p>';
      return;
    }
    let totalCash=0, totalSpent=0;
    rows.forEach(r=>{
      totalCash+=r.cash; totalSpent+=r.spent;
      const bal = r.cash-r.spent;
      const div = document.createElement("div");
      div.className="month-row";
      div.innerHTML = `<span>${fmtNice(r.date)}</span><span class="mono" style="color:${bal<0?'#B33A3A':'#3B6B35'};font-weight:700;">${rupee(bal)}</span>`;
      container.appendChild(div);
    });
    const totalDiv = document.createElement("div");
    totalDiv.className="month-total";
    totalDiv.innerHTML = `<span>Total</span><span class="mono">${rupee(totalCash-totalSpent)}</span>`;
    container.appendChild(totalDiv);
  }).catch((e)=>{
    container.innerHTML = '<p class="empty">Couldn\'t load. Check internet.</p>';
  });
}

document.getElementById("exportDayBtn").addEventListener("click", ()=>window.print());
document.getElementById("exportMonthBtn").addEventListener("click", ()=>window.print());
</script>
</body>
</html>
